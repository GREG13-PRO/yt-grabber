<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Grabber</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="bg-glow"></div>

<main class="shell">
  <header class="app-header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="24" height="24" rx="7" fill="url(#g)"/>
        <path d="M9.5 8.5L15.5 12L9.5 15.5V8.5Z" fill="white"/>
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FF5F6D"/>
            <stop offset="1" stop-color="#8338EC"/>
          </linearGradient>
        </defs>
      </svg>
      <span>YT Grabber</span>
    </div>
    <span class="badge">helyi &amp; privát</span>
  </header>

  <section class="card">
    <h1>Illessz be egy YouTube linket</h1>
    <p class="subtitle">Válaszd ki a minőséget, és töltsd le videóként vagy MP3-ként.</p>

    <div class="url-row">
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="url-input" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" spellcheck="false">
        <button id="paste-btn" class="icon-btn" title="Beillesztés vágólapról" type="button">
          <svg viewBox="0 0 24 24" fill="none"><rect x="6" y="4" width="12" height="16" rx="2" stroke="currentColor" stroke-width="2"/><path d="M9 4h6v2H9z" fill="currentColor"/></svg>
        </button>
      </div>
      <button id="fetch-btn" class="btn-primary">
        <span class="btn-label">Lekérdezés</span>
        <span class="spinner hidden"></span>
      </button>
    </div>

    <p id="fetch-error" class="error-msg hidden"></p>

    <section id="result" class="result hidden">
      <div class="video-card">
        <div class="thumb-wrap">
          <img id="thumbnail" src="" alt="Thumbnail">
          <span id="video-duration" class="duration-chip"></span>
        </div>
        <div class="video-meta">
          <h2 id="video-title"></h2>

          <div class="quality-picker" id="quality-picker"></div>

          <label class="reencode-toggle" id="reencode-row">
            <input type="checkbox" id="reencode-check" checked>
            <span>QuickTime-kompatibilis (H.264 átkódolás) — 4K/1440p-nél lassabb</span>
          </label>

          <button id="download-btn" class="btn-primary btn-download">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Letöltés</span>
          </button>
        </div>
      </div>

      <div id="progress-area" class="progress-area hidden">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill" style="width:0%"></div>
        </div>
        <div class="progress-row">
          <span id="progress-status">Indítás...</span>
          <span id="progress-percent"></span>
        </div>
        <a id="download-link" class="btn-primary btn-success hidden" href="#" download>
          <svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Fájl megnyitása</span>
        </a>
      </div>

      <p id="download-error" class="error-msg hidden"></p>
    </section>
  </section>

  <footer class="app-footer">
    <span id="accel-badge" class="accel-badge hidden"></span>
    <span>yt-dlp motorral &middot; csak személyes, helyi használatra</span>
  </footer>
</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
