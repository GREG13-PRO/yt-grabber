name: Build & release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            artifact_name: YT-Grabber-macOS
          - os: windows-latest
            artifact_name: YT-Grabber-Windows
          - os: ubuntu-latest
            artifact_name: YT-Grabber-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-build.txt

      # ffmpeg is bundled via the imageio-ffmpeg pip package (see
      # packaging/build.py) - a self-contained static build per platform, so
      # no separate download/install step is needed here.

      - name: Install Linux webview system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgtk-3-dev

      - name: Run PyInstaller
        run: python packaging/build.py

      - name: Package macOS .dmg
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "YT Grabber" -srcfolder "dist/YT Grabber.app" \
            -ov -format UDZO "${{ matrix.artifact_name }}.dmg"

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            "/DRepoRoot=$env:GITHUB_WORKSPACE" `
            "packaging\windows_installer.iss"
          Copy-Item "Output\YT-Grabber-Windows-Setup.exe" "${{ matrix.artifact_name }}-Setup.exe"

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: cp "dist/YT Grabber" "${{ matrix.artifact_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.dmg
            ${{ matrix.artifact_name }}-Setup.exe
            ${{ matrix.artifact_name }}
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
